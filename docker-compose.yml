version: "3.9"
services:
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: stocksense_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
    volumes:
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/stocksense_db
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
    ports:
      - "8000:8000"
    # Uncomment for GPU access:
    # runtime: nvidia

  celery_worker:
    build: ./backend
    command: celery -A app.workers.pipeline_worker.celery_app worker --loglevel=info --pool=solo
    depends_on:
      - redis
      - postgres
    volumes:
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/stocksense_db
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
    # Uncomment for GPU access:
    # runtime: nvidia

  celery_beat:
    build: ./backend
    command: celery -A app.workers.pipeline_worker.celery_app beat --loglevel=info
    depends_on:
      - redis

  # Frontend placeholder — uncomment when ready:
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
